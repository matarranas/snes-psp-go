name: Build PSP SNES Emulator

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: pspdev/pspdev:latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install required libraries
        run: |
          psp-pacman -Sy --noconfirm psp-libpng psp-libjpeg-turbo psp-zlib || true

      - name: Build Snes9xTYL ME (Media Engine Optimized)
        run: |
          make me V=1

      - name: Prepare Release Package
        run: |
          mkdir -p build_output/snes9xTYL/DATA
          cp EBOOT.PBP build_output/snes9xTYL/
          cp mediaengine.prx build_output/snes9xTYL/
          cp homehook.prx build_output/snes9xTYL/
          cp data/snesadvance.dat build_output/snes9xTYL/DATA/
          cp -r data build_output/snes9xTYL/data || true
          cp -r doc build_output/snes9xTYL/ || true

      - name: Upload EBOOT Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Snes9xTYL-Go-Optimized
          path: build_output/
