name: Build PSP SNES Emulator

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: pspdev/pspdev:latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install required libraries
        run: |
          psp-pacman -Sy --noconfirm psp-libpng psp-libjpeg-turbo psp-zlib || true

      - name: Build Snes9xTYL ME (Media Engine Optimized)
        run: |
          make me V=1 2>&1 | tee build.log

      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Prepare Release Package
        run: |
          mkdir -p build_output/snes9xTYL/DATA
          echo "=== Files in workspace ==="
          ls -la
          # If EBOOT.PBP was not created, build it from TARGET or snes9xTYL.prx
          if [ ! -f EBOOT.PBP ]; then
            echo "Packaging EBOOT.PBP manually..."
            PRX_FILE=$(ls *.prx 2>/dev/null | grep -v mediaengine | grep -v homehook | head -n 1)
            if [ -n "$PRX_FILE" ]; then
              pack-pbp EBOOT.PBP PARAM.SFO data/icon0.png NULL NULL NULL NULL "$PRX_FILE" NULL || true
            fi
          fi
          test -f EBOOT.PBP || { echo "ERROR: EBOOT.PBP could not be generated!"; exit 1; }
          cp -f EBOOT.PBP build_output/snes9xTYL/
          cp -f mediaengine.prx build_output/snes9xTYL/ || true
          cp -f homehook.prx build_output/snes9xTYL/ || true
          cp -f data/snesadvance.dat build_output/snes9xTYL/DATA/ || true
          cp -rf data build_output/snes9xTYL/data || true
          cp -rf doc build_output/snes9xTYL/ || true
          ls -la build_output/snes9xTYL/

      - name: Upload EBOOT Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Snes9xTYL-Go-Optimized
          path: build_output/
